<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
{% include 'admin/navbar.html' %}

<main class="ap-main-content" id="apMainContent">
    <div class="container-fluid py-4">
        
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h4 class="fw-bold mb-1" style="color: #0B1330;">Update Subcategory</h4>
                <p class="text-muted small mb-0">Modify subcategory name, parent category, or icon.</p>
            </div>
            <a href="{% url 'subcategories_list' %}" class="btn btn-outline-secondary px-3 py-2 rounded-3">
                <i class="bi bi-arrow-left me-1"></i> Back to List
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-4 col-md-8 mx-auto">
            <div class="card-body p-4">
                <form action="{% url 'update_subcategory' subcat.id %}" method="POST">
                    {% csrf_token %}

                    <!-- Main Category Selection -->
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Parent Main Category</label>
                        <select name="category_id" class="form-select rounded-3 py-2" required>
                            {% for cat in all_categories %}
                                <option value="{{ cat.id }}" {% if cat.id == subcat.category.id %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Subcategory Name -->
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Subcategory Name</label>
                        <input type="text" name="subcat_name" value="{{ subcat.subcat_names }}" class="form-control rounded-3 py-2" required>
                    </div>

                    <!-- Icon Class -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small">Bootstrap Icon Class</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3">
                                <i class="{{ subcat.subcat_icons }} text-primary"></i>
                            </span>
                            <input type="text" name="subcat_icon" value="{{ subcat.subcat_icons }}" class="form-control rounded-end-3 py-2" required>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn text-white px-4 py-2 rounded-3" style="background: #6C5CE7;">
                            <i class="bi bi-check-lg me-1"></i> Update Subcategory
                        </button>
                        <a href="{% url 'subcategories_list' %}" class="btn btn-light border px-4 py-2 rounded-3">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>

    </div>
</main>
